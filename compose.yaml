name: webmonitor
services:
  # 单体服务：FastAPI 同时提供 API 和前端静态页面，浏览器只访问一个 origin。
  # 因此没有跨域：不再有 CORS 配置，也没有第二个前端容器。
  webmonitor:
    image: ${WEBMONITOR_IMAGE:-ghcr.io/webmonitor/webmonitor:latest}
    pull_policy: always
    container_name: webmonitor
    restart: unless-stopped
    environment:
      # 数据库配置 - 使用SQLite
      DATABASE_URL: sqlite:///./data/webmonitor.db

      # JWT配置 - SECRET_KEY 必须显式提供（至少 32 字符），没有默认值
      SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY（至少 32 个字符的随机串）}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      TARGET_ALLOWED_ORIGINS: ${TARGET_ALLOWED_ORIGINS:-}

      # 应用配置
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 首次启动引导管理员：库里已有管理员时这些值不会被使用。
      # 没有管理员且 ADMIN_PASSWORD 为空时启动会失败，这是刻意的。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # 没有部署级邮件配置：通知只会发到用户自己在应用里配置的 SMTP 地址。
      # 任务可以不配邮件，那样只采集并记录日志。

    ports:
      # 页面与 API 共用这一个端口：http://localhost:8000/
      - "8000:8000"
    healthcheck:
      # 镜像里不再安装 curl，探活用 Python 标准库
      test: [ "CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
