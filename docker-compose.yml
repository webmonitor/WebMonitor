name: webmonitor
services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    container_name: webmonitor-backend
    restart: unless-stopped
    environment:
      # 数据库配置 - 使用SQLite
      DATABASE_URL: sqlite:///./data/webmonitor.db

      # JWT配置
      SECRET_KEY: ${SECRET_KEY:-your_very_secure_secret_key_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # 监控配置
      DEFAULT_CHECK_INTERVAL: 300
      MAX_CHECK_INTERVAL: 86400
      MIN_CHECK_INTERVAL: 10
      SELENIUM_HEADLESS: "true"
      SELENIUM_TIMEOUT: 30

      # 应用配置
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 浏览器直连后端：必须包含页面实际来源（scheme://host:port）。
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

      # 默认管理员账户
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@webmonitor.com}

    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - webmonitor-network

  # 前端服务：纯静态站点，不再反向代理 /api/。
  # 浏览器直连后端，因此 API 地址在构建时烧进 bundle（见 deploy/web.Dockerfile），
  # 且后端必须通过 BACKEND_CORS_ORIGINS 放行页面来源。
  frontend:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        # 必须在构建期确定；留空则使用相对路径（要求前置代理把 /api 转给后端）。
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: webmonitor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - webmonitor-network

networks:
  webmonitor-network:
    driver: bridge
