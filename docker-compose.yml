name: webmonitor
services:
  # 单体服务：FastAPI 同时提供 API 和前端静态页面，浏览器只访问一个 origin。
  # 因此没有跨域：不再有 CORS 配置，也没有第二个前端容器。
  webmonitor:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: webmonitor
    restart: unless-stopped
    environment:
      # 数据库配置 - 使用SQLite
      DATABASE_URL: sqlite:///./data/webmonitor.db

      # JWT配置
      SECRET_KEY: ${SECRET_KEY:-your_very_secure_secret_key_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # 监控配置
      DEFAULT_CHECK_INTERVAL: 300
      MAX_CHECK_INTERVAL: 86400
      MIN_CHECK_INTERVAL: 10
      SELENIUM_HEADLESS: "true"
      SELENIUM_TIMEOUT: 30

      # 应用配置
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 默认管理员账户
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@webmonitor.com}

    ports:
      # 页面与 API 共用这一个端口：http://localhost:8000/
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
